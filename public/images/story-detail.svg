    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b494"/><stop offset="0.5" stop-color="#a98f6d"/><stop offset="1" stop-color="#6d5843"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.35" r="0.7"><stop offset="0" stop-color="#fff1da" stop-opacity="0.7"/><stop offset="1" stop-color="#fff1da" stop-opacity="0"/></radialGradient>

