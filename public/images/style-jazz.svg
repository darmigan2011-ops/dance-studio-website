<path d="M 300 266 C 255 248 215 232 178 218" fill="none" stroke="#0c0506" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M 320 266 C 368 280 412 296 452 308" fill="none" stroke="#0c0506" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
