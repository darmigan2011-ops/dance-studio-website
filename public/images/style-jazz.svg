<path d="M 312 406 C 362 442 372 502 332 534" fill="none" stroke="#0c0506" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
    <circle cx="310" cy="212" r="33" fill="#0c0506" opacity="1"/>
