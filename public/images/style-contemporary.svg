<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img">
  <defs>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3524"/><stop offset="0.5" stop-color="#2c2016"/><stop offset="1" stop-color="#14100b"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.3" r="0.65"><stop offset="0" stop-color="#e0a35c" stop-opacity="0.85"/><stop offset="1" stop-color="#e0a35c" stop-opacity="0"/></radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
    </filter>
  </defs>
  
    <rect width="600" height="800" fill="url(#bg)"/>
    <rect width="600" height="800" fill="url(#glow)"/>
    <g transform="translate(60 -40) rotate(64)" opacity="0.22">
