<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img">
  <defs>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d1013"/><stop offset="0.5" stop-color="#23090c"/><stop offset="1" stop-color="#100405"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.3" r="0.65"><stop offset="0" stop-color="#ef6a52" stop-opacity="0.85"/><stop offset="1" stop-color="#ef6a52" stop-opacity="0"/></radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
    </filter>
  </defs>
  
    <rect width="600" height="800" fill="url(#bg)"/>
    <rect width="600" height="800" fill="url(#glow)"/>
    <g transform="translate(60 -40) rotate(64)" opacity="0.22">
          <rect x="0" y="-45" width="900" height="90" fill="url(#beamGrad)" rx="45"/>
        </g>
<g transform="translate(260 -60) rotate(70)" opacity="0.16">
          <rect x="0" y="-25" width="850" height="50" fill="url(#beamGrad)" rx="25"/>
        </g>
    <ellipse cx="300" cy="720" rx="220" ry="34" fill="#000000" opacity="0.28"/>
    <g transform="translate(60 40) scale(0.86 0.86) translate(0 0)">
    
    <path d="M 320 256 C 336 316 352 362 356 402" fill="none" stroke="#0b0405" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M 316 276 C 280 302 274 342 300 372" fill="none" stroke="#0b0405" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M 332 270 C 372 242 392 192 382 142" fill="none" stroke="#0b0405" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M 356 402 C 350 492 346 572 342 652" fill="none" stroke="#0b0405" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M 346 406 C 312 472 302 542 312 642" fill="none" stroke="#0b0405" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
    <circle cx="320" cy="222" r="32" fill="#0b0405" opacity="1"/>
    
  </g>
    <rect width="600" height="800" fill="url(#vig)" opacity="0.45"/>
    <rect width="600" height="800" filter="url(#grain)"/>
  
</svg>