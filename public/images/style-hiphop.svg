    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2b3a"/><stop offset="0.5" stop-color="#15202c"/><stop offset="1" stop-color="#0b1119"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.3" r="0.65"><stop offset="0" stop-color="#5b9fd4" stop-opacity="0.85"/><stop offset="1" stop-color="#5b9fd4" stop-opacity="0"/></radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
